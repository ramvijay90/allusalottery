name: Automated Live Lottery Sync

on:
  schedule:
    # Runs at 04:30 UTC (11:30 PM EST) - right after Powerball / Mega Millions drawings
    - cron: '30 4 * * *'
    # Runs at 19:30 UTC (2:30 PM EST) - right after Midday Pick 3 / Pick 4 drawings
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to scrape'
        required: true
        default: 'national'
        type: choice
        options:
          - 'national'
          - 'all_states'

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Puppeteer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libnspr4 libnss3 \
            libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxkbcommon0 fonts-liberation

      - name: Run National Sync (Powerball, Mega Millions, Lotto America, Canada)
        if: "${{ github.event.inputs.target == 'national' || github.event_name == 'schedule' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npx tsx lottery-scraper/national_sync.ts --year=$(date +%Y)

      - name: Run All States Crawler
        if: "${{ github.event.inputs.target == 'all_states' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm run scrape:all
