name: Automated Live Lottery Sync

on:
  schedule:
    # 11:05 PM EST (04:05 UTC next day) - Mon, Wed, Sat (Powerball & Lotto America Draw Watcher)
    - cron: '5 4 * * 2,4,7'
    # 11:05 PM EST (04:05 UTC next day) - Tue, Fri (Mega Millions & Lotto Max Draw Watcher)
    - cron: '5 4 * * 3,6'
    # 1:15 PM EST (18:15 UTC) - Daily Midday Pick 3 / Pick 4 drawings
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Sync Mode'
        required: true
        default: 'watcher'
        type: choice
        options:
          - 'watcher'
          - 'national'
          - 'all_states'

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Puppeteer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libnspr4 libnss3 \
            libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxkbcommon0 fonts-liberation

      - name: Run Instant Live Watcher (Polls every 60s until source publishes)
        if: "${{ github.event.inputs.target == 'watcher' || github.event_name == 'schedule' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npx tsx lottery-scraper/live_watcher.ts

      - name: Run National Sync (Full manual sync across all 50 states)
        if: "${{ github.event.inputs.target == 'national' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npx tsx lottery-scraper/national_sync.ts --year=$(date +%Y) --force

      - name: Run All States Crawler (Full site crawl)
        if: "${{ github.event.inputs.target == 'all_states' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm run scrape:all
