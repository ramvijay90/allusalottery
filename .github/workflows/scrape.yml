name: Trigger Lottery Scraper
on:
  schedule:
    - cron: '0,30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper Batch
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          SCRAPER_PROXY_USERNAME: ${{ secrets.SCRAPER_PROXY_USERNAME }}
          SCRAPER_PROXY_PASSWORD: ${{ secrets.SCRAPER_PROXY_PASSWORD }}
        run: npx tsx lottery-scraper/batch_runner.ts
